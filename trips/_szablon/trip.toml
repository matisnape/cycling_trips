# Konfiguracja wyprawy. Skopiuj cały katalog _szablon/ jako trips/<slug>/ i wypełnij.
# Pola bez wartości domyślnej są WYMAGANE — build zgłosi czytelny błąd, gdy ich brakuje.
# Treść wyprawy (dni, kulinaria, źródła) jest w tresc.md; tu jest tylko to, co tresc.md
# nie opisuje: nazwa, hero, podstrony, kolor, analityka.

# Wymagane. Taki sam jak nazwa katalogu; wchodzi w adres …/cycling_trips/<slug>/.
# Małe litery, cyfry i myślniki, bez spacji i polskich znaków.
slug = "nazwa-kraju-2026"
lang = "pl"                        # opcjonalne, domyślnie "pl"

[site]
title       = "Nazwa wyprawy"              # brand w nagłówku i sufiks <title>
title_html  = "Nazwa<br>wyprawy"           # to samo do <h1> w hero, z ręcznym <br>
glyph       = "△"                          # znak przy brandzie
eyebrow     = "Kraj · Kraj — 01–10.08.2026"        # mały nadtytuł w hero
lede        = "Jedno–dwa zdania o wyprawie: trasa, czas, charakter."   # akapit pod tytułem
home_title       = "Nazwa wyprawy — rowerem przez …"      # <title> strony głównej
home_description = "Notatki z wyprawy rowerowej: N dni, ok. NNN km."  # <meta description>; pilnuj, żeby liczby się zgadzały z planem
footer      = "Notatki z wyprawy rowerowej · Nazwa 2026"  # stopka
map_caption_name = "Nazwa wyprawy"         # wchodzi w podpis pod mapką „z mapy »…«"
offline_filename = "nazwa-wyprawy-offline.html"   # nazwa pliku przy „Zapisz stronę offline"
offline_aria     = "Szkic trasy — opis dla czytników ekranu"

# Fakty w hero. Liczba dni i km jest liczona z tresc.md — tu tylko to, czego tam nie ma.
facts = ["+1000 m", "Najwyższy punkt 1000 m"]
# false, gdy któryś dzień ma nieznany kilometraż (wtedy suma km byłaby fałszywa)
show_total_km = true

# Podstrony z sekcji tresc.md. Kolejność tutaj = kolejność w nawigacji.
# `heading` musi się dokładnie zgadzać z nagłówkiem "# …" w tresc.md.
# Pusta lub nieobecna sekcja = brak podstrony i linku, bez błędu.
# Dodajesz nową: kolejny blok [[pages]] + sekcja w tresc.md (przed "# Źródła i dalsza lektura").
[[pages]]
slug = "praktyczne"
label = "Praktyczne"               # tekst w nawigacji
heading = "# Praktyczne informacje"
title = "Praktyczne informacje"    # tytuł strony
eyebrow = "W terenie"

[[pages]]
slug = "kulinaria"
label = "Kulinaria"
heading = "# Kulinaria i pamiątki"
title = "Kulinaria i pamiątki"
eyebrow = "Co zjeść, co przywieźć"

[[pages]]
slug = "ciekawostki"
label = "Ciekawostki"
heading = "# Ciekawostki"
title = "Ciekawostki"
eyebrow = "Drobiazgi po drodze"

[map]
# Szkic trasy (SVG) w mobile.html, rysowany offline ze śladu.
svg_skip_days  = []   # numery dni, których punkty leżą daleko od śladu (np. dzień busowy) — pomijane w szkicu
svg_min_points = 40   # ślad z mniejszą liczbą punktów = szkic się NIE rysuje (łamana z kilku punktów byłaby myląca)

[theme]
accent = "#2f6e78"    # kolor akcentu — jedno miejsce: pełny CSS, CSS mobilny i mapa

# Opcjonalne. Puste = brak analityki i brak banera cookies.
[analytics]
ga_id = ""            # Google Analytics 4, np. "G-XXXXXXXXXX"
cookiescript = ""     # baner zgód, np. "//cdn.cookie-script.com/s/<id>.js"; sensowny tylko z ga_id

# Opcjonalne, domyślnie ["opis", "mapa", "szlak"]: linie "- Opis: …", "- Mapa …: …",
# "- Szlak: …" w "# Meta" są linkami, a nie daniami w "Czego spróbować". Zmieniaj tylko,
# gdy potrzebujesz innych prefiksów.
# meta_skip_prefixes = ["opis", "mapa", "szlak"]

# Mrożenie (PLAYBOOK §2). Zwykle dzień po powrocie. Od tej daty build NIE generuje strony,
# tylko przepisuje gotową kopię trips/<slug>/frozen/; pierwszy build w tym dniu lub później
# tę kopię tworzy (zacommituj ją). Dzięki temu zmiany w silniku nie psują starych wypraw.
# Data jest do uzupełnienia przy zakładaniu wyprawy: dopóki stoi tu "RRRR-MM-DD", build
# zgłasza błąd (to celowe — nie zakładaj wyprawy bez daty). Bez całej sekcji [freeze]
# wyprawa jest budowana zawsze, jak dotąd.
# Zmiana treści po zamrożeniu nie ma skutku (build ostrzega); odmrożenie: python build.py <slug> --refreeze
[freeze]
date = "RRRR-MM-DD"   # np. "2026-08-24"
